    <script>
      try {
        var dark = localStorage.getItem('qa_dark');
        if (dark === 'true' || (!dark && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) { console.warn('[Alpha] Dark mode init failed:', e); }
    </script>
    <script>
      window.__alphaErrors = [];
      window.onerror = function(msg, src, line, col, err) {
        var entry = { msg: msg, src: src, line: line, col: col, ts: Date.now() };
        if (err) entry.stack = err.stack;
        window.__alphaErrors.push(entry);
        console.error('[Alpha] Uncaught error:', entry);
      };
      window.addEventListener('unhandledrejection', function(e) {
        var entry = { msg: 'UnhandledPromiseRejection', reason: String(e.reason), ts: Date.now() };
        if (e.reason && e.reason.stack) entry.stack = e.reason.stack;
        window.__alphaErrors.push(entry);
        console.error('[Alpha] Unhandled rejection:', entry);
      });
      console.log('[Alpha] Boot started at', new Date().toISOString());
    </script>
