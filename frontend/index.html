        <h1 style="font-size:24px;font-weight:700;color:#0f172a;margin-bottom:12px;">Alpha Quantitative NSE Stock Research Platform</h1>
        <p style="font-size:15px;color:#334155;margin-bottom:16px;">
          Alpha is an open-access, research-backed quantitative equity analysis platform developed for the Alpha Research &amp; Investment Club at the Faculty of Management Studies (FMS), University of Delhi. The system scans the top 150 liquid stocks on the National Stock Exchange of India (NSE) daily using 10 peer-reviewed academic factors, machine learning alpha models, and dynamic market regime detection.
        </p>
        <h2 style="font-size:18px;font-weight:600;color:#0f172a;margin-top:20px;margin-bottom:8px;">10 Academic Quantitative Factors</h2>
        <ul style="padding-left:20px;margin-bottom:16px;color:#475569;">
          <li><strong>Piotroski F-Score (2000):</strong> 9-point fundamental accounting health and solvency assessment.</li>
          <li><strong>Gross Profitability (Novy-Marx, 2013):</strong> Gross profit scaled by total assets for quality growth.</li>
          <li><strong>Earnings Quality &amp; Accruals (Sloan, 1996):</strong> Cash flow vs accounting accruals verification.</li>
          <li><strong>Multi-Horizon Momentum (Jegadeesh &amp; Titman, 1993):</strong> 12-month and 60-day relative strength.</li>
          <li><strong>Value Factor Composite (Fama &amp; French, 1992):</strong> Multi-metric B/M, E/P, and CF/P ranking.</li>
          <li><strong>Low Volatility Anomaly (Baker et al., 2011):</strong> Risk-adjusted volatility penalty.</li>
          <li><strong>Betting Against Beta (Frazzini &amp; Pedersen, 2014):</strong> Low-beta risk-adjusted alpha.</li>
          <li><strong>Investment Factor (Titman et al., 2004):</strong> Prudent capital expenditure discipline.</li>
          <li><strong>Standardized Unexpected Earnings / SUE (Bernard &amp; Thomas, 1989):</strong> Post-earnings announcement drift.</li>
          <li><strong>Mean Reversion (De Bondt &amp; Thaler, 1985):</strong> 60-day statistical price deviation recovery.</li>
        </ul>
