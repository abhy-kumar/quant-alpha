name: Daily Market Scan

on:
  schedule:
    # Early Morning:  ~4:07 AM IST = 22:37 UTC (previous day), Mon-Fri IST (Sun-Thu UTC)
    - cron: "37 22 * * 0-4"
    # Morning scan:   ~9:37 AM IST = 04:07 UTC, Mon-Fri (avoid exact 0/30 min delays)
    - cron: "7 4 * * 1-5"
    # Mid-day scan:   ~12:37 PM IST = 07:07 UTC, Mon-Fri 
    - cron: "7 7 * * 1-5"
    # Afternoon scan: ~4:11 PM IST = 10:41 UTC, Mon-Fri
    - cron: "41 10 * * 1-5"
    # Night scan:     ~10:07 PM IST = 16:37 UTC, Mon-Fri
    - cron: "37 16 * * 1-5"
    # Weekend update: ~9:07 AM IST Saturday = 03:37 UTC Saturday
    - cron: "37 3 * * 6"
  workflow_dispatch:
    inputs:
      send_notifications:
        description: Send the optional Telegram broadcast after publishing
        type: boolean
        default: false

# Prevent overlapping runs - if a new scan triggers while one is running,
# finish the current publication before starting another run.
concurrency:
  group: market-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run the full scan on weekdays (Mon-Fri UTC)
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule != '37 3 * * 6')

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore application caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/sector_cache.json
            data/fundamentals_cache.json
            data/news_cache.json
            data/ath_cache.json
            data/etf_list.json
          key: market-cache-v3-${{ github.run_id }}
          restore-keys: market-cache-v3-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run market scanner
        run: |
          .venv/bin/python db_split_join.py join
          .venv/bin/python -m engine.scanner
          .venv/bin/python db_split_join.py split

      - name: Commit and push updated data
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git config --local http.postBuffer 524288000
          git add frontend/public/market_data.json frontend/public/quant_data.json frontend/public/score_history.json frontend/public/backtest_runs/ frontend/public/strategy_history.json
          # Quoted pathspec so deleted/renamed DB parts are staged too
          git add -A -- 'data/market_scans.db.part_*'
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: auto-update market data [skip ci]"
          # Unstaged by-products are never published; log and drop them so the rebase is clean.
          git status --short --untracked-files=no
          git reset --hard --quiet HEAD
          # Large binary pushes can fail transiently; rebase on latest main and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::Push attempt $attempt failed; retrying."
            sleep $((attempt * 20))
          done
          echo "::error::Could not push updated data after 5 attempts."
          exit 1

      - name: Broadcast daily Telegram signals (optional)
        if: github.event_name != 'workflow_dispatch' || inputs.send_notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          .venv/bin/python -m notifications.telegram_bot

  weekend_update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run on Saturday cron only; manual dispatch runs the daily scan.
    if: github.event.schedule == '37 3 * * 6'

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore application caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/sector_cache.json
            data/fundamentals_cache.json
            data/news_cache.json
            data/ath_cache.json
            data/etf_list.json
          key: market-cache-v3-${{ github.run_id }}
          restore-keys: market-cache-v3-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run weekend update (outcome backfill + quant regen)
        run: |
          .venv/bin/python db_split_join.py join
          .venv/bin/python -m notifications.weekend_update
          .venv/bin/python db_split_join.py split

      - name: Commit and push updated quant data
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git config --local http.postBuffer 524288000
          git add frontend/public/quant_data.json frontend/public/backtest_runs/ frontend/public/strategy_history.json
          # Quoted pathspec so deleted/renamed DB parts are staged too
          git add -A -- 'data/market_scans.db.part_*'
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: weekend outcome backfill + quant update [skip ci]"
          # Unstaged by-products are never published; log and drop them so the rebase is clean.
          git status --short --untracked-files=no
          git reset --hard --quiet HEAD
          # Large binary pushes can fail transiently; rebase on latest main and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::Push attempt $attempt failed; retrying."
            sleep $((attempt * 20))
          done
          echo "::error::Could not push updated data after 5 attempts."
          exit 1

