name: Daily Market Scan

on:
  schedule:
    # Pre-open scan:   9:00 AM IST = 03:30 UTC, Mon-Fri (fresh data before market opens)
    - cron: "30 3 * * 1-5"
    # Mid-day scan:   12:30 PM IST = 07:00 UTC, Mon-Fri (intraday snapshot)
    - cron: "0 7 * * 1-5"
    # Post-market scan: 4:15 PM IST = 10:45 UTC, Mon-Fri (end-of-day signals, primary run)
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

# Prevent overlapping runs - if a new scan triggers while one is running,
# cancel the in-progress run and start fresh with current data.
concurrency:
  group: market-scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market scanner
        run: python scanner.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/public/market_data.json frontend/public/score_history.json data/market_scans.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update market data [skip ci]" && git push)
